# 本番の確認: デプロイが終わったら主要ページを確かめる。30分ごとに、デプロイが始まらず古いままになっていないかも確かめる
# Railway の Wait for CI に待たれないよう、push では動かさない
name: 本番の確認

on:
  deployment_status:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  actions: read

env:
  DASHBOARD: https://ai-lab-dashboard-production-fc9e.up.railway.app

jobs:
  smoke:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'production'))
    runs-on: ubuntu-latest
    steps:
      - name: 主要ページが開く
        run: |
          for p in / /projects /plan /diary /lab /growth /live /interventions /showcase; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --max-time 40 "$DASHBOARD$p")
            echo "$p $code"
            [ "$code" = "200" ] || exit 1
          done
      - name: ゲストは操作できない
        run: |
          for u in /api/loop /api/videos /api/interventions; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' --max-time 40 "$DASHBOARD$u")
            echo "$u $code"
            [ "$code" = "403" ] || exit 1
          done
      - name: main の最新が本番に届いている
        if: github.event_name != 'deployment_status'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          at=$(gh api "repos/$REPO/commits/main" --jq .commit.committer.date)
          age=$(( $(date +%s) - $(date -d "$at" +%s) ))
          # Railway のデプロイ記録で、最新の状態が success のものが今動いている版（入れ替わった版は inactive になる）
          live=""
          for id in $(gh api "repos/$REPO/deployments?per_page=15" --jq '.[] | select(.environment | contains("production")) | .id'); do
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = "success" ]; then live=$(gh api "repos/$REPO/deployments/$id" --jq .sha); break; fi
          done
          echo "本番 ${live:-不明} / main $head / ${age}秒前"
          if [ -z "$live" ]; then echo "動いている版が見つかりません"; exit 1; fi
          # CIで止めたコミットは本番に出ないのが正しいので、CIが通っているものだけを見る
          ok=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=push" --jq '[.workflow_runs[] | select(.name=="CI")][0].conclusion // ""')
          if [ "$live" != "$head" ] && [ "$age" -gt 1800 ] && [ "$ok" = "success" ]; then
            echo "CIは通ったのに、30分たっても本番が最新になっていません"; exit 1
          fi
      # 失敗が続いているあいだは、最初の1回だけ知らせる（NOTIFY_WEBHOOK_URL を GitHub の Secrets に入れると動く）
      - name: 失敗をDiscordに知らせる
        if: failure()
        env:
          WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          prev=$(gh api "repos/$REPO/actions/workflows/smoke.yml/runs?status=completed&per_page=20" --jq '[.workflow_runs[] | select(.conclusion != "skipped")][0].conclusion // ""')
          [ "$prev" != "failure" ] || exit 0
          jq -n --arg c "🚨 本番の確認に失敗しました: $RUN_URL" '{content: $c, allowed_mentions: {parse: []}}' \
            | curl -sS --fail --max-time 20 -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" > /dev/null
